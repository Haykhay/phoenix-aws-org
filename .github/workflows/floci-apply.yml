name: floci-apply

# Applies the REAL Layer 0 (landing-zone + registry) against a local Floci —
# the integration tier above the mock-provider `terraform test` suite. Uses the
# floci provider gate (var.floci=true). Pins floci/floci:nightly (the standard
# in phoenix-local; 2.4.0's Control Tower landing-zone read-back is broken).

on:
  push:
    branches: [floci-apply]
  pull_request:
  workflow_dispatch:
    inputs:
      floci_version:
        description: Floci image tag (default nightly)
        required: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4

      - name: Start Floci
        env:
          FLOCI_TAG: ${{ inputs.floci_version || 'nightly' }}
        run: |
          docker run -d --name floci -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e FLOCI_DEFAULT_REGION=eu-west-1 \
            "floci/floci:${FLOCI_TAG}"

      - name: Wait for Floci
        run: |
          for _ in $(seq 1 60); do
            if curl -s http://localhost:4566/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Floci did not come up" >&2
          docker logs floci
          exit 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Apply landing-zone against Floci
        working-directory: landing-zone
        run: |
          rm -f backend.tf   # use local state for the ephemeral Floci apply
          terraform init -input=false
          terraform apply -auto-approve -input=false -var floci=true
          terraform output

      - name: Apply registry against Floci
        working-directory: registry
        run: |
          rm -f backend.tf   # use local state for the ephemeral Floci apply
          terraform init -input=false
          terraform apply -auto-approve -input=false -var floci=true
          terraform output

      - name: Teardown
        if: always()
        run: docker rm -f floci || true
